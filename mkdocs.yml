site_name: Website Building Workflow
site_description: A practical workflow for planning, designing, building, testing, and deploying websites.
site_author: JoJo275
site_url: https://jojo275.github.io/website-building-workflow/
repo_url: https://github.com/JoJo275/website-building-workflow
repo_name: JoJo275/website-building-workflow
edit_uri: edit/main/docs/

copyright: Copyright &copy; 2024–2026 JoJo275

theme:
  name: material
  language: en
  icon:
    logo: material/sitemap
    repo: fontawesome/brands/github
    edit: material/pencil
    view: material/eye
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  features:
    # Navigation
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    # Search
    - search.highlight
    - search.suggest
    - search.share
    # Content
    - content.action.edit
    - content.action.view
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips

plugins:
  - search:
      separator: '[\s\-,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'
  - tags

markdown_extensions:
  # Python Markdown core
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      permalink_title: Anchor link to this section
      toc_depth: 3
  # PyMdown Extensions
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.critic
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink:
      repo_url_shorthand: true
      user: JoJo275
      repo: website-building-workflow
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

extra_css:
  - assets/stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/JoJo275
      name: GitHub on JoJo275
  generator: false

nav:
  - Home: index.md
  - Workflow:
      - Overview: workflow/01-overview.md
      - Website Types: workflow/02-website-types.md
      - Product Planning: workflow/03-product-planning.md
      - Information Architecture: workflow/04-information-architecture.md
      - Wireframes: workflow/05-wireframes.md
      - Visual Design: workflow/06-visual-design.md
      - Frontend: workflow/07-frontend.md
      - Backend: workflow/08-backend.md
      - Database: workflow/09-database.md
      - Testing: workflow/10-testing.md
      - Deployment: workflow/11-deployment.md
      - AI Workflows: workflow/12-ai-workflows.md
  - Checklists:
      - Launch Checklist: checklists/launch-checklist.md
      - UI QA Checklist: checklists/ui-qa-checklist.md
      - Accessibility Checklist: checklists/accessibility-checklist.md
      - Responsive Checklist: checklists/responsive-checklist.md
      - Copilot Implementation Checklist: checklists/copilot-implementation-checklist.md
  - Templates:
      - Product Brief: starters/product-brief.md
      - Route Map: starters/route-map.md
      - Repo Layouts: starters/repo-layouts.md
      - Screen Spec: starters/screen-spec.md
      - Component Spec: starters/component-spec.md
      - AI Task Brief: starters/ai-task-brief.md
      - PR Review: starters/pr-review.md
      - Debugging Template: starters/debugging-template.md
      - Feature Spec: starters/feature-spec.md
  - Design:
      - Overview: design/index.md
      - Design Tokens: design/design-tokens.md
      - Visual Style: design/visual-style.md
      - Copy & Voice: design/copy-voice.md
  - Conventions:
      - Semantic HTML: conventions/html.md
      - CSS Architecture: conventions/css.md
      - Example Design System: conventions/example-system.md
  - Tools:
      - Overview: tools/index.md
      - Design Tools: tools/design.md
      - Frontend: tools/frontend.md
      - Backend & Database: tools/backend.md
      - Dev Environment: tools/dev-environment.md
      - Third-Party Services: tools/third-party.md
  - Glossary: glossary.md
