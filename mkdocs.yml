site_name: Website Building Workflow
site_description: A repeatable workflow for building and deploying websites.
site_url: https://jojo275.github.io/website-building-workflow/
repo_url: https://github.com/JoJo275/website-building-workflow
repo_name: JoJo275/website-building-workflow
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - content.action.edit
    - content.code.copy

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Workflow:
      - Overview: workflow/overview.md
      - Planning: workflow/planning.md
      - Development: workflow/development.md
      - Deployment: workflow/deployment.md
  - Reference:
      - Checklists: reference/checklists.md
